spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: venue-service
              uri: ${VENUE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/venues/**,/api/courts/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/bookings/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/payments/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted

jwt:
  secret: change-this-to-a-long-random-secret-key-at-least-256-bits-for-hs256
