spring:
  application:
    name: booking-service
  mongodb:
    host: ${SPRING_MONGODB_HOST:localhost}
    port: 27017
    database: bookingdb
    username: admin
    password: admin
    authentication-database: admin
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

venue-service:
  base-url: ${VENUE_SERVICE_BASE_URL:http://localhost:8082}