spring:
  application:
    name: booking-service
  mongodb:
    host: localhost
    port: 27017
    database: bookingdb
    username: admin
    password: admin
    authentication-database: admin
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always