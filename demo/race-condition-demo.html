<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Double-Booking Prevention Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 1.4rem; }
        .panels { display: flex; gap: 20px; margin-top: 20px; }
        .panel { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 16px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #444; margin-bottom: 2px; }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { display: block; width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; min-height: 60px; margin-top: 10px; }
        .success { border-color: #16a34a; }
        .failure { border-color: #dc2626; }
    </style>
</head>
<body>

<h1>Double-Booking Prevention Demo</h1>
<p>Fill in identical details in both panels, then click "Fire Both Simultaneously."
    Only one request should succeed (201) — the other should be rejected (409), proving the
    Redis-based slot lock prevents double-booking.</p>

<div class="panels">
    <div class="panel" id="panel1">
        <h3>Request A</h3>

        <label for="courtId1">Court ID</label>
        <input id="courtId1" value="1">

        <label for="venueId1">Venue ID</label>
        <input id="venueId1" value="1">

        <label for="userId1">User ID</label>
        <input id="userId1" value="1">

        <label for="bookingDate1">Booking Date</label>
        <input id="bookingDate1" type="date" value="2026-09-15">

        <label for="startTime1">Start Time</label>
        <input id="startTime1" type="time" value="14:00">

        <label for="durationHours1">Duration (hours)</label>
        <input id="durationHours1" type="number" value="1">

        <button onclick="bookCourt(1)">Book Now (A)</button>
        <pre id="result1">Waiting...</pre>
    </div>

    <div class="panel" id="panel2">
        <h3>Request B</h3>

        <label for="courtId2">Court ID</label>
        <input id="courtId2" value="1">

        <label for="venueId2">Venue ID</label>
        <input id="venueId2" value="1">

        <label for="userId2">User ID</label>
        <input id="userId2" value="1">

        <label for="bookingDate2">Booking Date</label>
        <input id="bookingDate2" type="date" value="2026-09-15">

        <label for="startTime2">Start Time</label>
        <input id="startTime2" type="time" value="14:00">

        <label for="durationHours2">Duration (hours)</label>
        <input id="durationHours2" type="number" value="1">

        <button onclick="bookCourt(2)">Book Now (B)</button>
        <pre id="result2">Waiting...</pre>
    </div>
</div>

<p style="margin-top:20px;">
    <button onclick="bookBoth()" style="background:#7c3aed;">Fire Both Simultaneously</button>
</p>

<script>
    const BASE_URL = "http://localhost:8083";

    async function bookCourt(n) {
      const body = {
        courtId: Number(document.getElementById('courtId' + n).value),
        venueId: Number(document.getElementById('venueId' + n).value),
        userId: Number(document.getElementById('userId' + n).value),
        bookingDate: document.getElementById('bookingDate' + n).value,
        startTime: document.getElementById('startTime' + n).value + ':00',
        durationHours: Number(document.getElementById('durationHours' + n).value)
      };

      const resultEl = document.getElementById('result' + n);
      const panelEl = document.getElementById('panel' + n);
      panelEl.classList.remove('success', 'failure');
      resultEl.textContent = 'Sending...';

      try {
        const response = await fetch(BASE_URL + '/api/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await response.json();
        resultEl.textContent = `Status: ${response.status}\n${JSON.stringify(data, null, 2)}`;
        panelEl.classList.add(response.status === 201 ? 'success' : 'failure');
      } catch (err) {
        resultEl.textContent = 'Error: ' + err.message;
        panelEl.classList.add('failure');
      }
    }

    function bookBoth() {
      bookCourt(1);
      bookCourt(2);
    }
</script>

</body>
</html>
